name: car_service
description: Car service and maintenance tracker
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Database
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.18
  sqlite3: ^2.1.0

  # State management
  flutter_riverpod: ^2.4.10

  # Navigation
  go_router: ^13.2.5

  # Files & images
  image_picker: ^1.0.7
  file_picker: ^6.2.1
  open_file: ^3.3.2
  path_provider: ^2.1.3
  path: ^1.8.3

  # Utils
  intl: ^0.18.1
  uuid: ^4.3.3
  archive: ^3.4.9
  crypto: ^3.0.3

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.14.1
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#11151C"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/
